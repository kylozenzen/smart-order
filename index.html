</div>

var GOAL_NOUN={protein:'protein',sodium:'sodium',carbs:'carb',cal:'calorie'};
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function n(x){if(typeof x!=='number')return'—';return Math.round(x*10)/10===Math.round(x)?Math.round(x).toLocaleString():(Math.round(x*10)/10).toLocaleString()}
function pctClass(v){return v>=95?'good':(v>=60?'warn':'bad')}
function base(item){var o={};FIELDS.forEach(function(f){o[f]=(item[f]===null||item[f]===undefined)?null:item[f]});return o}
function apply(vals,mods,idxs){var o={};FIELDS.forEach(function(f){o[f]=vals[f]});(idxs||[]).forEach(function(i){var d=(mods[i]&&mods[i].delta)||{};FIELDS.forEach(function(f){if(typeof d[f]==='number'&&typeof o[f]==='number')o[f]+=d[f]})});FIELDS.forEach(function(f){if(typeof o[f]==='number')o[f]=Math.max(0,Math.round(o[f]*10)/10)});return o}
function known(v,g){if(g==='none')return true;if(g==='protein')return typeof v.protein_g==='number'&&typeof v.cal==='number';return typeof v[GOAL_FIELD[g]]==='number'}
function passes(v,g){var t=DATA.thresholds;if(!known(v,g))return false;if(g==='protein'){if(v.cal<=0)return false;return v.protein_g>=t.protein.min_g&&(v.protein_g/v.cal)*100>=t.protein.min_g_per_100cal}if(g==='sodium')return v.sodium_mg<=t.sodium.max_mg;if(g==='carbs')return v.net_carbs_g<=t.carbs.max_net_g;if(g==='cal')return v.cal<=t.calories.max;return true}
function improves(mod,g){var d=mod.delta||{};if(g==='sodium')return(d.sodium_mg||0)<0;if(g==='carbs')return(d.net_carbs_g||0)<0;if(g==='cal')return(d.cal||0)<0;if(g==='protein'){var dp=d.protein_g||0,dc=d.cal||0;return(dc<0&&dp>=dc*.06)||(dp>0&&dc<=0)}return false}
function suggest(item,g){if(g==='none')return null;var mods=item.mods||[],out=[],cur=base(item);for(var i=0;i<mods.length;i++){if(passes(cur,g))break;if(!improves(mods[i],g))continue;out.push(i);cur=apply(base(item),mods,out)}return passes(cur,g)?out:null}
function classification(item,g){var b=base(item);if(g==='none')return'browse';if(!known(b,g))return'unknown';if(passes(b,g))return'best';if(suggest(item,g))return'smarter';return'other'}
function fits(item,g){var c=classification(item,g);return c==='best'||c==='smarter'||g==='none'}
function deltaStr(d){var p=[];if(typeof d.cal==='number'&&d.cal)p.push((d.cal>0?'+':'')+n(d.cal)+' cal');if(typeof d.sodium_mg==='number'&&d.sodium_mg)p.push((d.sodium_mg>0?'+':'')+n(d.sodium_mg)+'mg');if(typeof d.net_carbs_g==='number'&&d.net_carbs_g)p.push((d.net_carbs_g>0?'+':'')+n(d.net_carbs_g)+'c');if(typeof d.protein_g==='number'&&d.protein_g)p.push((d.protein_g>0?'+':'')+n(d.protein_g)+'p');return p.slice(0,3).join(' · ')}

function renderDataCard(c){var ds=statusFor(c),p=ds.field_coverage_pct||{},src=ds.source_note||'No source note on file.';return'<section class="data-card"><div class="data-top"><div><div class="data-title">Data receipt</div><p class="data-summary">'+esc(ds.summary||'')+'</p></div><span class="statuspill '+esc(ds.state)+'"><span class="dot '+esc(ds.state)+'"></span>'+esc(statusLabel(ds.state))+'</span></div><div class="coverage-grid">'+coverageLine('Calories',p.calories)+coverageLine('Protein',p.protein)+coverageLine('Net carbs',p.net_carbs)+coverageLine('Sodium',p.sodium)+'</div><details><summary>Why does this have this status?</summary><p class="data-detail"><b>Coverage:</b> '+esc(ds.coverage_note||'Curated Smart Picks.')+'<br><b>Source:</b> '+esc(src)+'<br><b>Last checked:</b> '+esc(ds.last_checked||ds.nutrition_date||'Not recorded')+'.</p></details></section>'}
function statsLine(v,g){function cell(label,val,target,ok){var miss=val.indexOf('—')>-1;return'<div class="line"><span class="k">'+label+'</span><span class="v'+(miss?' none':target?(ok?' hit':' miss'):'')+'">'+val+'</span></div>'}var t=DATA.thresholds;return cell('Calories',n(v.cal),g==='cal',typeof v.cal==='number'&&v.cal<=t.calories.max)+cell('Protein',n(v.protein_g)+' g',g==='protein',passes(v,'protein'))+cell('Net carbs',n(v.net_carbs_g)+' g',g==='carbs',typeof v.net_carbs_g==='number'&&v.net_carbs_g<=t.carbs.max_net_g)+cell('Sodium',n(v.sodium_mg)+' mg',g==='sodium',typeof v.sodium_mg==='number'&&v.sodium_mg<=t.sodium.max_mg)+cell('Sugar',n(v.sugar_g)+' g',false,false)+cell('Sat fat',n(v.sat_fat_g)+' g',false,false)}
function orderKey(chain,idx){return chain.id+':'+idx}
function orderHas(key){return order.some(function(x){return x.key===key})}
function goalStat(v,g){
 if(g==='sodium')return{num:n(v.sodium_mg),unit:'mg sodium',alt:n(v.cal)+' cal'};
 if(g==='carbs')return{num:n(v.net_carbs_g),unit:'g net carbs',alt:n(v.cal)+' cal'};

}
function reminderFor(chain,idx,cls,sel){

 if(cls==='smarter'&&sel.length){
  var v=apply(base(item),mods,sel),st=goalStat(v,goal),labels=sel.map(function(i){return(mods[i]||{}).label}).filter(Boolean);
  var shown=labels.slice(0,2).join(' and ').toLowerCase(),extra=labels.length>2?' (+'+(labels.length-2)+' more)':'';
  return'Ask for <b>'+esc(shown)+'</b>'+extra+' and it drops to <b>'+st.num+' '+esc(st.unit)+'</b>.';

function homeIntro(){if(isSimple())return welcomeLine();return welcomeLine()+'<section class="receipt homeintro"><div class="receipt-kicker">Smart Order · Order Advisor</div><div class="receipt-title">Know what you’re ordering.</div><p class="receipt-copy">Choose a goal. We’ll surface the Smart Picks we can actually support with nutrition data, show the changes that help, and tell you when the data isn’t strong enough to call it.</p><hr class="receipt-rule"><div class="receipt-row"><span class="label">Restaurants</span><strong>'+DATA.chains.length+'</strong></div><div class="receipt-row"><span class="label">Smart Picks analyzed</span><strong>'+DATA.chains.reduce(function(a,c){return a+c.items.length},0)+'</strong></div><div class="receipt-row"><span class="label">Coverage promise</span><strong>Curated, not complete menus</strong></div></section>'}

function viewChain(id){var c=chainById(id);if(!c)return'<div class="empty"><b>Not found</b>This restaurant is not in the current Smart Order dataset.</div>';var ds=statusFor(c),cats=[];c.items.forEach(function(it){if(it.cat&&cats.indexOf(it.cat)===-1)cats.push(it.cat)});if(cat!=='all'&&cats.indexOf(cat)===-1)cat='all';var inCat=c.items.map(function(_,i){return i}).filter(function(i){return cat==='all'||c.items[i].cat===cat});sortIdxs(c,inCat);var groups={best:[],smarter:[],unknown:[],other:[]};inCat.forEach(function(i){var cls=classification(c.items[i],goal);if(goal==='none')groups.other.push(i);else groups[cls].push(i)});var catRow=cats.length>1?'<div class="chiprow cats"><button class="chip" data-cat="all" aria-pressed="'+(cat==='all')+'">All</button>'+cats.map(function(k){return'<button class="chip" data-cat="'+esc(k)+'" aria-pressed="'+(cat===k)+'">'+esc(k)+'</button>'}).join('')+'</div>':'';var tips=(c.tips||[]).map(function(t){return'<li>'+esc(t)+'</li>'}).join('');var isPin=pins.indexOf(c.id)>-1;var body='';if(goal==='none'){body='<div class="grouphead"><div class="label">All Smart Picks · '+groups.other.length+'</div><div class="explain">Curated orders Smart Order has analyzed for this restaurant.</div></div>'+groups.other.map(function(i){return renderItem(c,i,false)}).join('')}else{['best','smarter','unknown','other'].forEach(function(type){if(groups[type].length)body+=groupHead(type,groups[type].length)+groups[type].map(function(i){return renderItem(c,i,false)}).join('')});if(!groups.best.length&&!groups.smarter.length){var cov=relevantCoverage(c),msg=groups.unknown.length?'We can’t confidently find a verified match for this goal yet because some of the required nutrition data is missing.':'None of the '+inCat.length+' Smart Picks we analyzed clear this goal'+(ds.coverage==='curated'?'. That does not mean nothing on the restaurant’s full menu can work.':'.');body='<div class="empty"><b>No verified match yet</b>'+esc(msg)+(cov!==null?'<br><br><strong>'+cov+'%</strong> of these Smart Picks have the '+esc(GOAL_NOUN[goal])+' data needed for this filter.':'')+'</div>'+body}}var addons=(c.addons||[]).map(function(a){var cost=[];if(a.cal)cost.push('+'+n(a.cal)+' cal');if(a.sodium_mg)cost.push('+'+n(a.sodium_mg)+'mg');if(a.sugar_g)cost.push('+'+n(a.sugar_g)+'g sugar');return'<div class="addon"><span>'+esc(a.name)+(a.note?'<small>'+esc(a.note)+'</small>':'')+'</span><span class="cost">'+cost.join(' · ')+'</span></div>'}).join('');if(isSimple()){var sbody='';var LBL={best:'Best bets',smarter:'Make it smarter',unknown:'Can’t verify',other:'Doesn’t match'};
 if(goal==='none'){sbody=groups.other.map(function(i){return renderItem(c,i,false)}).join('')}

function addOrder(key,quiet){var parts=key.split(':'),c=chainById(parts[0]),idx=+parts[1];if(!c||!c.items[idx])return;var item=c.items[idx],sel=(picks[key]||[]).slice(),v=apply(base(item),item.mods||[],sel),mods=sel.map(function(i){return(item.mods[i]||{}).label}).filter(Boolean),entry={key:key,chain_id:c.id,chain_name:c.name,item_idx:idx,item_name:item.name,mods:mods,selected_mods:sel,totals:v,added_at:new Date().toISOString()};var at=-1;order.forEach(function(x,i){if(x.key===key)at=i});if(at>-1)order[at]=entry;else order.push(entry);save();if(!quiet){showToast((at>-1?'Updated ':'Added ')+item.name+' in My Order');renderCurrentItem(key)}}

function viewAbout(){var verified=DATA.chains.filter(function(c){return statusFor(c).state==='verified'}).length,installBlock=isStandalone()?'<div class="data-card"><div class="data-title">Installed app</div><p class="data-summary">✓ Smart Order is running as an installed app. The app shell and nutrition dataset are cached locally for repeat use.</p></div>':'<div class="data-card"><div class="data-title">Install Smart Order</div><p class="data-summary">Install it for a faster, app-like launch and reliable offline access after the first download. Smart Order is designed to reuse local cached data instead of downloading the app again every time.</p><button class="smallbtn" type="button" data-install-app="1">Install / show instructions</button></div>';return'<div class="backbar"><button data-back="1">‹ Back</button></div><section class="receipt"><div class="receipt-kicker">Smart Order · Data policy</div><div class="receipt-title">Useful beats pretending.</div><p class="receipt-copy">Smart Order is an order advisor, not a full restaurant menu database. We curate useful choices, show the nutrition fields we have, and make missing data visible instead of silently filling gaps.</p><hr class="receipt-rule"><div class="receipt-row"><span class="label">Restaurants</span><strong>'+DATA.chains.length+'</strong></div><div class="receipt-row"><span class="label">Fully current-verified sets</span><strong>'+verified+'</strong></div><div class="receipt-row"><span class="label">Dataset</span><strong>'+esc(DATA.updated||DATA.version)+'</strong></div></section>'+installBlock+'<div class="data-card"><div class="data-title">Low-data update mode</div><p class="data-summary">Smart Order uses its cached nutrition dataset on normal launches and makes one tiny automatic version check about once a week. It only downloads the full dataset when the version actually changes.</p><button class="smallbtn ghost" type="button" data-check-update="1">Check for nutrition update now</button></div><div cla
