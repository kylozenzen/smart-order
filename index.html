<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Order</title>
<meta name="description" content="Find what actually fits your goal at the drive-thru.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #14181C;
    --paper:    #F1F3EE;
    --panel:    #FFFFFF;
    --rule:     #D5DAD1;
    --muted:    #6B7269;
    --pass:     #1D6B47;
    --caution:  #B3690F;
    --fail:     #A93B32;

    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body:    'Barlow', system-ui, -apple-system, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 72px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--ink); color: var(--paper);
    margin: 0 -14px 0;
    padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
  }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: 30px; letter-spacing: .04em; text-transform: uppercase;
    margin: 0; line-height: 1;
  }
  .stamp {
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; color: #9BA49A; text-align: right; white-space: nowrap;
  }
  .stamp b { color: var(--paper); font-weight: 500; }

  /* ---------- goal chips ---------- */
  .goals {
    display: flex; gap: 7px; overflow-x: auto; margin: 0 -14px;
    padding: 12px 14px; scrollbar-width: none;
    background: var(--paper);
    position: sticky; top: 0; z-index: 15;
    border-bottom: 1px solid var(--rule);
  }
  .goals::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-family: var(--display); font-weight: 600;
    font-size: 15px; letter-spacing: .05em; text-transform: uppercase;
    padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 2px;
    background: transparent; color: var(--ink); cursor: pointer;
    min-height: 40px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip:focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }

  .rule-note {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 10px 0 2px; letter-spacing: .01em;
  }

  /* ---------- chain ---------- */
  .chain { margin-top: 26px; }
  .board {
    background: var(--ink); color: var(--paper);
    padding: 8px 12px; display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
  }
  .board h2 {
    font-family: var(--display); font-weight: 700; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; margin: 0; line-height: 1.1;
  }
  .unverified {
    font-family: var(--mono); font-size: 9px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink); background: #E0A93B;
    padding: 3px 6px; white-space: nowrap;
  }

  .chain-tips { list-style: none; margin: 0; padding: 10px 0 2px; }
  .chain-tips li {
    font-size: 14px; color: var(--muted); padding: 3px 0 3px 16px;
    position: relative;
  }
  .chain-tips li::before {
    content: "→"; position: absolute; left: 0; color: var(--ink);
    font-family: var(--mono); font-size: 12px;
  }

  /* ---------- item card ---------- */
  .item {
    background: var(--panel); border: 1px solid var(--rule);
    margin-top: 10px; padding: 12px;
  }
  .item.dim { opacity: .55; }
  .item-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .item-name { font-weight: 600; font-size: 17px; line-height: 1.25; margin: 0; }
  .item-note { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

  .badge {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px;
    border: 1.5px solid currentColor; white-space: nowrap;
  }
  .badge.pass    { color: var(--pass); }
  .badge.partial { color: var(--caution); }
  .badge.fail    { color: var(--fail); }

  /* ---------- ticket ---------- */
  .ticket { font-family: var(--mono); font-size: 13px; margin-top: 10px; }
  .line {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 2px 0; font-variant-numeric: tabular-nums;
  }
  .line .k { color: var(--muted); }
  .line .v { font-weight: 500; }
  .line .v.hit { color: var(--pass); font-weight: 700; }
  .line .v.miss { color: var(--fail); font-weight: 700; }

  .tear {
    border: 0; border-top: 1px dashed var(--rule); margin: 9px 0;
  }

  .mods-title {
    font-family: var(--display); font-weight: 600; font-size: 14px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 4px;
  }
  .mod {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 0; cursor: pointer; min-height: 38px;
  }
  .mod input { width: 19px; height: 19px; accent-color: var(--pass); flex: 0 0 auto; margin: 0; }
  .mod .lbl { font-family: var(--body); font-size: 14px; flex: 1; }
  .mod .dlt {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .mod input:focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }

  .total {
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    padding: 6px 0; margin-top: 8px;
  }
  .total .line { padding: 1px 0; font-weight: 700; }
  .total .k { color: var(--ink); }

  /* ---------- add-ons ---------- */
  .addons {
    margin-top: 12px; border-left: 3px solid var(--caution);
    background: #FBF6EC; padding: 10px 12px;
  }
  .addons h3 {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: .07em; text-transform: uppercase; margin: 0 0 6px;
    color: var(--caution);
  }
  .addon {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 14px; padding: 3px 0; font-variant-numeric: tabular-nums;
  }
  .addon .cost { font-family: var(--mono); font-size: 12px; color: var(--caution); font-weight: 700; white-space: nowrap; }
  .addon small { display: block; color: var(--muted); font-size: 12px; }

  /* ---------- tips ---------- */
  .tips { margin-top: 34px; border-top: 2px solid var(--ink); padding-top: 14px; }
  .tips h2 {
    font-family: var(--display); font-weight: 700; font-size: 20px;
    letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px;
  }
  .tips p { font-size: 14px; color: var(--ink); margin: 0 0 12px; padding-left: 20px; position: relative; }
  .tips p::before {
    content: "✓"; position: absolute; left: 0; top: 0; color: var(--pass);
    font-family: var(--mono); font-weight: 700;
  }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted);
    font-size: 15px;
  }
  .empty b { display: block; font-family: var(--display); font-size: 22px;
    letter-spacing: .05em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 532px; margin: 0 auto; background: var(--ink); color: var(--paper);
    font-family: var(--mono); font-size: 12px; letter-spacing: .03em;
    padding: 12px 14px; z-index: 40;
    transform: translateY(140%); transition: transform .28s ease;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  #toast.up { transform: translateY(0); }
  #toast button {
    background: var(--paper); color: var(--ink); border: 0; padding: 6px 10px;
    font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Smart Order</h1>
      <div class="stamp" id="stamp">Loading…</div>
    </div>
  </header>

  <nav class="goals" id="goals" aria-label="Filter by goal"></nav>
  <div class="rule-note" id="ruleNote"></div>

  <main id="app"></main>

  <section class="tips" id="tips"></section>
</div>

<div id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastBtn" type="button">Reload</button>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state
  var DATA = null;
  var goal = localStorage.getItem('so:goal') || 'none';
  var picks = JSON.parse(localStorage.getItem('so:picks') || '{}'); // itemKey -> [modIndexes]

  var GOALS = [
    { id: 'none',    label: 'All items' },
    { id: 'protein', label: 'High protein' },
    { id: 'sodium',  label: 'Low sodium' },
    { id: 'carbs',   label: 'Low carb' },
    { id: 'cal',     label: 'Under 500' }
  ];

  var FIELDS = ['cal','protein_g','net_carbs_g','fat_g','sat_fat_g','sodium_mg','sugar_g'];

  // ---------------------------------------------------------------- helpers
  function base(item) {
    var o = {};
    FIELDS.forEach(function (f) { o[f] = item[f] || 0; });
    return o;
  }

  function apply(vals, mods, idxs) {
    var o = {};
    FIELDS.forEach(function (f) { o[f] = vals[f]; });
    (idxs || []).forEach(function (i) {
      var d = mods[i] && mods[i].delta || {};
      FIELDS.forEach(function (f) { if (d[f]) o[f] += d[f]; });
    });
    FIELDS.forEach(function (f) { o[f] = Math.max(0, Math.round(o[f] * 10) / 10); });
    return o;
  }

  function passes(v, g) {
    var t = DATA.thresholds;
    if (g === 'protein') {
      if (v.cal <= 0) return false;
      return v.protein_g >= t.protein.min_g &&
             (v.protein_g / v.cal) * 100 >= t.protein.min_g_per_100cal;
    }
    if (g === 'sodium') return v.sodium_mg <= t.sodium.max_mg;
    if (g === 'carbs')  return v.net_carbs_g <= t.carbs.max_net_g;
    if (g === 'cal')    return v.cal <= t.calories.max;
    return true;
  }

  // Does this mod move the item toward the active goal?
  function improves(mod, g) {
    var d = mod.delta || {};
    if (g === 'sodium')  return (d.sodium_mg || 0) < 0;
    if (g === 'carbs')   return (d.net_carbs_g || 0) < 0;
    if (g === 'cal')     return (d.cal || 0) < 0;
    if (g === 'protein') {
      // Improves protein density: adds protein, or cuts calories faster than protein.
      var dp = d.protein_g || 0, dc = d.cal || 0;
      if (dc < 0 && dp >= dc * 0.06) return true;
      return dp > 0 && dc <= 0;
    }
    return false;
  }

  // Greedily stack helpful mods until the item clears the goal.
  function suggest(item, g) {
    var mods = item.mods || [];
    var cur = base(item), out = [];
    for (var i = 0; i < mods.length; i++) {
      if (passes(cur, g)) break;
      if (!improves(mods[i], g)) continue;
      out.push(i);
      cur = apply(base(item), mods, out);
    }
    return passes(cur, g) ? out : null;
  }

  function n(x) { return Math.round(x).toLocaleString(); }

  function deltaStr(d) {
    var parts = [];
    if (d.cal)        parts.push((d.cal > 0 ? '+' : '') + n(d.cal) + ' cal');
    if (d.sodium_mg)  parts.push((d.sodium_mg > 0 ? '+' : '') + n(d.sodium_mg) + 'mg');
    if (d.net_carbs_g)parts.push((d.net_carbs_g > 0 ? '+' : '') + n(d.net_carbs_g) + 'c');
    if (d.protein_g)  parts.push((d.protein_g > 0 ? '+' : '') + n(d.protein_g) + 'p');
    if (d.sugar_g && !d.cal) parts.push((d.sugar_g > 0 ? '+' : '') + n(d.sugar_g) + 'g sug');
    return parts.slice(0, 3).join(' · ');
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function save() {
    localStorage.setItem('so:goal', goal);
    localStorage.setItem('so:picks', JSON.stringify(picks));
  }

  // ---------------------------------------------------------------- render
  function ruleText() {
    var t = DATA.thresholds;
    if (goal === 'protein') return 'HIGH PROTEIN = ' + t.protein.min_g + 'g or more, and at least ' + t.protein.min_g_per_100cal + 'g per 100 cal.';
    if (goal === 'sodium')  return 'LOW SODIUM = ' + n(t.sodium.max_mg) + 'mg or less. Very little clears this.';
    if (goal === 'carbs')   return 'LOW CARB = ' + t.carbs.max_net_g + 'g net carbs or less.';
    if (goal === 'cal')     return 'UNDER 500 = ' + t.calories.max + ' calories or less, as ordered.';
    return 'Pick a goal to see what fits — and what fits once you change the order.';
  }

  function renderGoals() {
    document.getElementById('goals').innerHTML = GOALS.map(function (g) {
      return '<button class="chip" type="button" data-goal="' + g.id + '" aria-pressed="' +
        (goal === g.id) + '">' + esc(g.label) + '</button>';
    }).join('');
    document.getElementById('ruleNote').textContent = ruleText();
  }

  function statsLine(v, g) {
    function cell(label, val, isTarget, ok) {
      var cls = 'v' + (isTarget ? (ok ? ' hit' : ' miss') : '');
      return '<div class="line"><span class="k">' + label + '</span><span class="' + cls + '">' + val + '</span></div>';
    }
    return cell('Calories', n(v.cal), g === 'cal', v.cal <= DATA.thresholds.calories.max) +
           cell('Protein', n(v.protein_g) + ' g', g === 'protein', passes(v, 'protein')) +
           cell('Net carbs', n(v.net_carbs_g) + ' g', g === 'carbs', v.net_carbs_g <= DATA.thresholds.carbs.max_net_g) +
           cell('Sodium', n(v.sodium_mg) + ' mg', g === 'sodium', v.sodium_mg <= DATA.thresholds.sodium.max_mg) +
           cell('Sugar', n(v.sugar_g) + ' g', false, true) +
           cell('Sat fat', n(v.sat_fat_g) + ' g', false, true);
  }

  function renderItem(chain, item, idx) {
    var key = chain.id + ':' + idx;
    var mods = item.mods || [];
    var b = base(item);

    // First visit under a goal: pre-check the mods that make it work.
    if (!picks[key] && goal !== 'none' && !passes(b, goal)) {
      var s = suggest(item, goal);
      if (s && s.length) picks[key] = s;
    }
    var sel = picks[key] || [];
    var v = apply(b, mods, sel);

    var status, badge;
    if (goal === 'none') { status = 'ok'; badge = ''; }
    else if (passes(b, goal)) { status = 'pass'; badge = '<span class="badge pass">Fits as is</span>'; }
    else if (passes(v, goal)) { status = 'partial'; badge = '<span class="badge partial">Fits with changes</span>'; }
    else if (suggest(item, goal)) { status = 'partial'; badge = '<span class="badge partial">Can fit</span>'; }
    else { status = 'fail'; badge = '<span class="badge fail">Doesn\'t fit</span>'; }

    var modHtml = '';
    if (mods.length) {
      modHtml = '<hr class="tear"><p class="mods-title">Order it this way</p>' +
        mods.map(function (m, i) {
          return '<label class="mod"><input type="checkbox" data-key="' + key + '" data-mod="' + i + '"' +
            (sel.indexOf(i) > -1 ? ' checked' : '') + '>' +
            '<span class="lbl">' + esc(m.label) + '</span>' +
            '<span class="dlt">' + esc(deltaStr(m.delta || {})) + '</span></label>';
        }).join('');
    }

    var totalHtml = sel.length
      ? '<div class="total"><div class="line"><span class="k">As you\'d order it</span>' +
        '<span class="v">' + n(v.cal) + ' cal · ' + n(v.protein_g) + 'p · ' + n(v.sodium_mg) + 'mg</span></div></div>'
      : '';

    return '<article class="item' + (status === 'fail' ? ' dim' : '') + '" data-key="' + key + '">' +
      '<div class="item-head"><div><h3 class="item-name">' + esc(item.name) + '</h3>' +
      (item.note ? '<p class="item-note">' + esc(item.note) + '</p>' : '') + '</div>' + badge + '</div>' +
      '<div class="ticket">' + statsLine(v, goal) + modHtml + totalHtml + '</div>' +
      '</article>';
  }

  function renderChain(chain) {
    var items = chain.items.slice();

    if (goal !== 'none') {
      items = items.filter(function (it) {
        return passes(base(it), goal) || suggest(it, goal);
      });
      items.sort(function (a, c) {
        var pa = passes(base(a), goal) ? 0 : 1, pc = passes(base(c), goal) ? 0 : 1;
        if (pa !== pc) return pa - pc;
        if (goal === 'protein') return (c.protein_g / c.cal) - (a.protein_g / a.cal);
        if (goal === 'sodium')  return a.sodium_mg - c.sodium_mg;
        if (goal === 'carbs')   return a.net_carbs_g - c.net_carbs_g;
        return a.cal - c.cal;
      });
    }

    if (!items.length) return '';

    var tips = (chain.tips || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
    var addons = (chain.addons || []).map(function (a) {
      var cost = [];
      if (a.cal) cost.push('+' + n(a.cal) + ' cal');
      if (a.sodium_mg) cost.push('+' + n(a.sodium_mg) + 'mg');
      if (a.sugar_g) cost.push('+' + n(a.sugar_g) + 'g sugar');
      return '<div class="addon"><span>' + esc(a.name) +
        (a.note ? '<small>' + esc(a.note) + '</small>' : '') + '</span>' +
        '<span class="cost">' + cost.join(' · ') + '</span></div>';
    }).join('');

    // Track original indexes so mod state stays stable through sorting.
    var idxOf = {};
    chain.items.forEach(function (it, i) { idxOf[it.name] = i; });

    return '<section class="chain">' +
      '<div class="board"><h2>' + esc(chain.name) + '</h2>' +
      (chain.verified === false ? '<span class="unverified">Seed data</span>' : '') + '</div>' +
      (tips ? '<ul class="chain-tips">' + tips + '</ul>' : '') +
      items.map(function (it) { return renderItem(chain, it, idxOf[it.name]); }).join('') +
      (addons ? '<div class="addons"><h3>Watch the add-ons</h3>' + addons + '</div>' : '') +
      '</section>';
  }

  function render() {
    renderGoals();

    var html = DATA.chains.map(renderChain).join('');
    document.getElementById('app').innerHTML = html || (
      '<div class="empty"><b>Nothing clears this one</b>' +
      'No item on file fits that goal, even with changes. That\'s a real answer — try a different goal.</div>'
    );

    document.getElementById('tips').innerHTML =
      '<h2>Rules that always hold</h2>' +
      (DATA.tips || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('');

    document.getElementById('stamp').innerHTML =
      'Menu data<br><b>' + esc(DATA.updated || DATA.version) + '</b>';

    save();
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) {
      goal = chip.dataset.goal;
      picks = {};              // fresh suggestions for the new goal
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  document.addEventListener('change', function (e) {
    var box = e.target;
    if (!box.matches('.mod input')) return;
    var key = box.dataset.key, i = +box.dataset.mod;
    var sel = picks[key] || [];
    var at = sel.indexOf(i);
    if (box.checked && at === -1) sel.push(i);
    if (!box.checked && at > -1) sel.splice(at, 1);
    picks[key] = sel;
    save();

    // Repaint just this card so the page doesn't jump under your thumb.
    var card = document.querySelector('.item[data-key="' + key + '"]');
    var parts = key.split(':');
    var chain = DATA.chains.filter(function (c) { return c.id === parts[0]; })[0];
    if (card && chain) {
      var tmp = document.createElement('div');
      tmp.innerHTML = renderItem(chain, chain.items[+parts[1]], +parts[1]);
      card.replaceWith(tmp.firstChild);
    }
  });

  // ---------------------------------------------------------------- toast
  var toast = document.getElementById('toast');
  function showToast(msg, action) {
    document.getElementById('toastMsg').textContent = msg;
    var btn = document.getElementById('toastBtn');
    btn.onclick = action || function () { toast.classList.remove('up'); };
    toast.classList.add('up');
    if (!action) setTimeout(function () { toast.classList.remove('up'); }, 4000);
  }

  // ---------------------------------------------------------------- boot + sync
  function load(opts) {
    return fetch('./data.json', opts).then(function (r) { return r.json(); });
  }

  load().then(function (d) {
    DATA = d;
    render();
    checkVersion();
  }).catch(function () {
    document.getElementById('app').innerHTML =
      '<div class="empty"><b>No menu data</b>Connect once to download the menus. After that it works offline.</div>';
  });

  // The 30-day sync: a few hundred bytes, checked on every launch.
  function checkVersion() {
    fetch('./version.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        if (!v.version || v.version === DATA.version) return;
        return load({ cache: 'reload' }).then(function (d) {
          DATA = d;
          render();
          showToast('Menus updated — ' + (d.updated || d.version));
        });
      })
      .catch(function () { /* offline is fine; cached data stands */ });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
